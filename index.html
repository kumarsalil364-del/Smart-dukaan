
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART DUKAAN Master Prompt</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px;color:#172554}
main{max-width:950px;margin:auto;background:white;padding:25px;border-radius:12px}
h1{text-align:center;color:#174ea6}
textarea{width:100%;height:600px;box-sizing:border-box;padding:15px;font-size:14px;line-height:1.5}
button{padding:12px 18px;background:#174ea6;color:white;border:0;border-radius:7px;margin:8px 5px 8px 0;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>SMART DUKAAN</h1>
<h2>Complete Website Development Prompt</h2>
<p>Select the prompt below and copy it into your AI coding assistant.</p>

<textarea id="prompt">You are an expert web developer.

Create a complete, professional and fully functional SHOP MANAGEMENT WEBSITE called SMART DUKAAN.

IMPORTANT: I need the actual complete website code, not an explanation or design preview.

TECHNOLOGY:
- HTML5
- CSS3
- Vanilla JavaScript
- LocalStorage
- Responsive design

DESIGN:
- Preserve my original SMART DUKAAN logo and branding.
- Use the original blue and white colour theme.
- Professional sidebar navigation.
- Modern dashboard cards.
- Responsive for mobile, tablet and desktop.

CREATE THESE COMPLETE WORKING SECTIONS:

1. DASHBOARD
- Total sales
- Today's sales
- Monthly sales
- Total products
- Available stock
- Stock value
- Total expenses
- Net balance
- Recent transactions
- Low stock alerts

2. FIRM PROFILE
- Firm name
- Owner name
- Address
- Phone
- Email
- GST number
- Logo
- Save and edit details
- Show firm details on invoices

3. PRODUCT MANAGEMENT
- Add products
- Edit products
- Delete products
- Product name and ID
- Category
- Purchase price
- Selling price
- GST percentage
- Opening stock
- Available stock
- Search and filter
- Low stock alerts

4. NEW SALE AND BILLING
- Select multiple products
- Enter quantity
- Customer name and phone
- Automatic calculations
- Discount
- GST
- Grand total
- Cash, UPI, Card and Credit payment modes
- Generate invoice number
- Save sale
- Print invoice
- Automatically reduce stock
- Prevent sales exceeding available stock

5. DAILY SALES
- Date-wise sales
- Invoice number
- Customer
- Total amount
- Payment mode
- Daily cash, UPI, card and credit totals

6. EXPENSES
- Add, edit and delete expenses
- Expense category
- Description
- Amount
- Date
- Payment mode
- Total expenses

7. SALES HISTORY
- View all sales
- Search by invoice or customer
- Filter by date
- View and print invoices
- Delete individual sales with confirmation
- Restore product stock when a sale is deleted
- Update dashboard and reports

8. REPORTS
- Daily report
- Weekly report
- Monthly report
- Yearly report
- Product-wise sales
- Stock report
- Expense report
- Profit summary
- Payment summary
- Print reports

9. BACKUP AND RESTORE
- Export all data to JSON
- Import JSON backup
- Validate imported data
- Confirm before replacing data
- Reset data only after confirmation

10. SETTINGS
- General settings
- Invoice settings
- Currency settings
- Data management

DATA REQUIREMENTS:
- Save all data using LocalStorage.
- Data must remain after refreshing the page.
- Fix all save, edit and delete errors.
- Avoid undefined variables and missing element IDs.
- Show success and error messages.
- Keep data consistent when deleting sales or products.
- Never silently delete data.

FINAL OUTPUT:
Generate the entire working website code.
Include HTML, CSS and JavaScript.
Do not omit any section.
Do not use placeholder buttons.
Do not provide partial code.
Do not write "same as above".
Do not only explain the solution.

Return a complete HTML file from <!DOCTYPE html> to </html>.
The file must be ready to save as smart-dukaan.html and open in Chrome.

If the code is too long, continue in numbered parts without skipping or repeating code.

I will provide my original website code and logo. Preserve the original design and improve its functionality.</textarea>

<br>
<button onclick="copyText()">COPY PROMPT</button>
<button onclick="downloadHTML()">DOWNLOAD HTML FILE</button>
<p id="status">You can also select all text in the box and press Ctrl+C.</p>
</main>

<script>
function copyText(){
 const box=document.getElementById("prompt");
 box.focus();
 box.select();
 box.setSelectionRange(0,box.value.length);
 try{
   const success=document.execCommand("copy");
   document.getElementById("status").textContent=
     success ? "Prompt copied successfully!" : "Select the text and press Ctrl+C.";
 }catch(e){
   document.getElementById("status").textContent="Select the text and press Ctrl+C.";
 }
}
function downloadHTML(){
 const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
 const blob=new Blob([html],{type:"text/html"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="smart-dukaan-prompt.html";
 a.click();
 URL.revokeObjectURL(url);
 document.getElementById("status").textContent="HTML download started.";
}
</script>
</body>
</html>
