    let appState = {
      activeFirmId: 'FIRM_1',
      theme: 'light',
      cloudConfig: { url: '', anonKey: '', adminEmail: '', lastSync: null, connected: false },
      firms: { FIRM_1: createEmptyFirmData('FIRM_1') }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.firms && parsed.activeFirmId) {
            appState = parsed;
          }
        }
      } catch (e) {
        console.error('Error loading storage:', e);
      }
      if (!appState.firms || !Object.keys(appState.firms).length) { const id = 'FIRM_' + Date.now(); appState.firms = { [id]: createEmptyFirmData(id) }; appState.activeFirmId = id; }
      applyTheme();
      populateFirmSwitcher();
      updateBadges();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        updateBadges();
      } catch (e) {
        showToast('Storage limit reached! Export backup and clear old images.', 'error');
      }
    }

    function getFirm() {
      const firm = appState.firms[appState.activeFirmId];
      if (!firm) return null;
      const defaults = { quotations: [], warehouses: [{id:'WH-MAIN',name:'Main Store',location:'Primary location'}], stockTransfers: [], cashbook: [], bankbook: [], income: [], tasks: [], employees: [], attendance: [], salaries: [], offers: [], delivery: [], auditLog: [], branches: [{id:'BR-MAIN',name:'Main Branch',address:'',phone:''}] };
      Object.entries(defaults).forEach(([key, value]) => { if (!Array.isArray(firm[key])) firm[key] = value; });
      if (!Array.isArray(firm.suppliers)) firm.suppliers = [];
      return firm;
    }

    function addAudit(action, details='') {
      const f = getFirm(); if (!f) return;
      f.auditLog.unshift({id:'AUD-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:new Date().toISOString(),action,details});
      f.auditLog = f.auditLog.slice(0,500);
    }


    /*************************************************************************

     *************************************************************************/
    const fmtINR = (num) => '₹' + Number(num || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-900 dark:bg-slate-800 text-white border border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transform transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" class="opacity-75 hover:opacity-100">✕</button>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3800);
    }

    function applyTheme() {
      const html = document.documentElement;
      if (appState.theme === 'dark') {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
      if (currentRoute === 'dashboard' || currentRoute === 'reports') renderCurrentRoute();
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      sb.classList.toggle('-translate-x-full');
      bd.classList.toggle('hidden');
    }

    function openModal(title, htmlContent, maxWidthClass = 'max-w-2xl') {
      document.getElementById('app-modal-title').textContent = title;
      document.getElementById('app-modal-content').innerHTML = htmlContent;
      const box = document.getElementById('app-modal-box');
      box.className = `bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl w-full ${maxWidthClass} overflow-hidden my-auto`;
      const modal = document.getElementById('app-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('app-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function populateFirmSwitcher() {
      const select = document.getElementById('firm-switcher');
      if (!select) return;
      const firms = Object.values(appState.firms || {});
      if (!firms.length) {
        const id = 'FIRM_' + Date.now();
        appState.firms = { [id]: createEmptyFirmData(id) };
        appState.activeFirmId = id;
      }
      select.innerHTML = Object.values(appState.firms).map(f =>
        `<option value="${v3Esc(f.profile.id)}" ${f.profile.id === appState.activeFirmId ? 'selected' : ''}>${v3Esc(f.profile.businessName || 'Unnamed Firm')}</option>`
      ).join('');
    }

    function switchFirm(firmId) {
      appState.activeFirmId = firmId;
      posCart = [];
      storeCart = [];
      saveState();
      populateFirmSwitcher();
      renderCurrentRoute();
      showToast(`Switched to ${getFirm().profile.businessName}`);

    function handleCreateFirm(e) {
      e.preventDefault();
      const id = 'FIRM_' + Date.now();
      const name = document.getElementById('new-firm-name').value.trim();
      const store = document.getElementById('new-firm-store').value.trim();
      const gstin = document.getElementById('new-firm-gstin').value.trim().toUpperCase();
      appState.firms[id] = createEmptyFirmData(id, name);
      appState.firms[id].profile.storeName = store;
      appState.firms[id].profile.gstin = gstin;
      appState.activeFirmId = id;
      saveState();
      populateFirmSwitcher();
      closeModal();
      renderCurrentRoute();
      showToast(`Created new firm: ${name}`);

      firm.sales.forEach(s => { salesByDate[s.date] = (salesByDate[s.date] || 0) + s.grandTotal; });

      const ctx1 = document.getElementById('chart-sales-overview');
      if (ctx1) {

    function renderPOSProductCards(list) {
      if (!list.length) return '<div class="col-span-full text-center py-8 text-xs text-slate-400">No matching products found.</div>';
      return list.map(p => `
        <button type="button" onclick="addToPOSCart('${p.id}')" class="text-left p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-brand-500 bg-slate-50/50 dark:bg-slate-800/40 transition flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between gap-1 mb-1">
              <span class="text-[10px] font-mono text-slate-400">${p.code}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${p.stock <= 0 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'}">${p.stock} in stock</span>
            </div>
            <div class="text-xs font-bold line-clamp-2 group-hover:text-brand-600">${p.name}</div>
          </div>
          <div class="mt-2 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 flex items-center justify-between">
            <span class="text-xs font-extrabold text-slate-900 dark:text-white">${fmtINR(p.sellingPrice)}</span>
            <span class="text-[10px] text-slate-400">+${p.gst}% GST</span>
          </div>
        </button>
      `).join('');
    }

    function filterPOSProducts() {
      const q = document.getElementById('pos-search').value.toLowerCase().trim();
      const filtered = getFirm().products.filter(p => p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
      document.getElementById('pos-product-grid').innerHTML = renderPOSProductCards(filtered);
    }

    function handlePOSBarcodeEnter(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = e.target.value.trim().toLowerCase();
        const exact = getFirm().products.find(p => p.code.toLowerCase() === q);
        if (exact) {
          addToPOSCart(exact.id);
          e.target.value = '';
          filterPOSProducts();
        }
      }
    }

    function autofillPOSCustomer(name) {
      const c = getFirm().customers.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (c) document.getElementById('pos-cust-phone').value = c.phone || '';
    }

    function setPOSTaxType(type) {
      document.getElementById('pos-tax-type').value = type;
      const localBtn = document.getElementById('tax-local-btn');
      const interBtn = document.getElementById('tax-inter-btn');
      if (type === 'LOCAL') {
        localBtn.className = 'px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 shadow-xs text-brand-600 dark:text-white';
        interBtn.className = 'px-2.5 py-1 rounded-lg text-slate-500';
      } else {
        interBtn.className = 'px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 shadow-xs text-brand-600 dark:text-white';
        localBtn.className = 'px-2.5 py-1 rounded-lg text-slate-500';
      }
      updatePOSCartUI();
    }

    function addToPOSCart(productId) {
      const p = getFirm().products.find(x => x.id === productId);
      if (!p) return;
      if (p.stock <= 0) {
        showToast(`${p.name} is out of stock!`, 'error');
        return;
      }
      const existing = posCart.find(i => i.productId === productId);
      if (existing) {
        if (existing.qty + 1 > p.stock) {
          showToast(`Only ${p.stock} units available in stock`, 'error');
          return;
        }
        existing.qty += 1;
      } else {
        posCart.push({ productId: p.id, name: p.name, price: p.sellingPrice, costPrice: p.costPrice, gst: p.gst, qty: 1 });
      }
      updatePOSCartUI();
    }

    function updatePOSQty(productId, delta) {
      const idx = posCart.findIndex(i => i.productId === productId);
      if (idx === -1) return;
      const p = getFirm().products.find(x => x.id === productId);
      const nextQty = posCart[idx].qty + delta;
      if (nextQty <= 0) {
        posCart.splice(idx, 1);
      } else if (p && nextQty > p.stock) {
        showToast(`Max available stock is ${p.stock}`, 'error');
        return;
      } else {
        posCart[idx].qty = nextQty;
      }
      updatePOSCartUI();
    }

    function clearPOSCart() {
      posCart = [];
      updatePOSCartUI();
    }

    function updatePOSCartUI() {
      const listEl = document.getElementById('pos-cart-list');
      const totalsEl = document.getElementById('pos-totals-box');
      if (!listEl || !totalsEl) return;

      if (!posCart.length) {
        listEl.innerHTML = `<div class="text-center py-8 text-xs text-slate-400 border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">Cart is empty. Click products on the left to add.</div>`;
      } else {
        listEl.innerHTML = posCart.map(item => `
          <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 text-xs">
            <div class="min-w-0 flex-1">
              <div class="font-bold truncate">${item.name}</div>
              <div class="text-[11px] text-slate-500">${fmtINR(item.price)} × ${item.qty} <span class="text-brand-600">(GST ${item.gst}%)</span></div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="updatePOSQty('${item.productId}', -1)" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-bold">-</button>
              <span class="w-6 text-center font-bold">${item.qty}</span>
              <button onclick="updatePOSQty('${item.productId}', 1)" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-bold">+</button>
            </div>
            <div class="font-extrabold w-16 text-right">${fmtINR(item.price * item.qty)}</div>
          </div>
        `).join('');
      }

      const subtotal = posCart.reduce((s, i) => s + i.price * i.qty, 0);
      const totalTax = posCart.reduce((s, i) => s + (i.price * i.qty * i.gst / 100), 0);
      const discount = Math.max(0, Number(document.getElementById('pos-discount')?.value || 0));
      const grandTotal = Math.max(0, subtotal + totalTax - discount);
      const taxType = document.getElementById('pos-tax-type')?.value || 'LOCAL';

      const taxRows = taxType === 'LOCAL'
        ? `<div class="flex justify-between text-slate-500"><span>CGST (50%)</span><span>${fmtINR(totalTax / 2)}</span></div>
           <div class="flex justify-between text-slate-500"><span>SGST (50%)</span><span>${fmtINR(totalTax / 2)}</span></div>`
        : `<div class="flex justify-between text-slate-500"><span>IGST (100%)</span><span>${fmtINR(totalTax)}</span></div>`;

      totalsEl.innerHTML = `
        <div class="flex justify-between text-slate-500"><span>Taxable Subtotal</span><span>${fmtINR(subtotal)}</span></div>
        ${taxRows}
        <div class="flex justify-between text-rose-500"><span>Discount</span><span>- ${fmtINR(discount)}</span></div>
        <div class="flex justify-between text-sm font-extrabold pt-1.5 border-t border-slate-200 dark:border-slate-700">
          <span>Grand Total</span><span class="text-brand-600 dark:text-brand-400">${fmtINR(grandTotal)}</span>
        </div>
      `;
    }

    function completePOSSale() {
      if (!posCart.length) {
        showToast('Add at least one product to generate a bill.', 'error');
        return;
      }
      const firm = getFirm();
      const customerName = document.getElementById('pos-cust-name').value.trim() || 'Walk-in Customer';
      const customerPhone = document.getElementById('pos-cust-phone').value.trim();
      const taxType = document.getElementById('pos-tax-type').value;
      const paymentMethod = document.getElementById('pos-payment-method').value;
      const discount = Math.max(0, Number(document.getElementById('pos-discount').value || 0));

      let subtotal = 0, totalTax = 0, totalCost = 0;
      const billItems = posCart.map(item => {
        const taxable = item.price * item.qty;
        const taxAmt = taxable * (item.gst / 100);
        subtotal += taxable;
        totalTax += taxAmt;
        totalCost += (item.costPrice || 0) * item.qty;

        // Deduct inventory stock
        const prod = firm.products.find(p => p.id === item.productId);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);

        return {
          productId: item.productId, name: item.name, qty: item.qty,
          price: item.price, costPrice: item.costPrice || 0, gst: item.gst,
          taxable, taxAmt, total: taxable + taxAmt
        };
      });

      const grandTotal = Math.max(0, subtotal + totalTax - discount);
      const invoiceNo = `${firm.profile.invoicePrefix}${firm.invoiceCounter++}`;
      const newSale = {
        id: 'INV-' + Date.now(),
        invoiceNo,
        date: new Date().toISOString().split('T')[0],
        customerName, customerPhone, customerAddress: '',
        taxType, paymentMethod,
        paymentStatus: paymentMethod === 'Credit' ? 'Pending' : 'Paid',
        discount, items: billItems, subtotal, totalTax, grandTotal, totalCost
      };

      firm.sales.push(newSale);

      // Auto-save / update Customer CRM & Khata
      if (customerName !== 'Walk-in Customer') {
        let cust = firm.customers.find(c => (customerPhone && c.phone === customerPhone) || c.name.toLowerCase() === customerName.toLowerCase());
        if (!cust) {
          cust = { id: 'CUS-' + Date.now(), name: customerName, phone: customerPhone, email: '', address: '', totalSpend: 0, ordersCount: 0, dueBalance: 0 };
          firm.customers.push(cust);
        }
        cust.totalSpend += grandTotal;
        cust.ordersCount += 1;
        if (paymentMethod === 'Credit') cust.dueBalance += grandTotal;
      }

      posCart = [];
      saveState();
      renderCurrentRoute();
      showToast(`Invoice ${invoiceNo} saved!`);
      viewInvoiceModal(newSale.id);
    }

    function shareInvoiceWhatsApp(saleId) {
      const firm = getFirm();
      const sale = firm.sales.find(s => s.id === saleId);
      if (!sale) return;
      const lines = [
        `*${firm.profile.businessName}*`,
        `Invoice: *${sale.invoiceNo}* (${sale.date})`,
        `Customer: ${sale.customerName}`,
        `------------------------`,
        ...sale.items.map(i => `${i.name} x${i.qty} = ${fmtINR(i.total)}`),
        `------------------------`,
        `Total GST: ${fmtINR(sale.totalTax)}`,
        `*Grand Total: ${fmtINR(sale.grandTotal)}*`,
        `Payment: ${sale.paymentMethod} (${sale.paymentStatus})`,
        `Thank you for shopping with us!`
      ].join('\n');
      const phone = (sale.customerPhone || '').replace(/\D/g, '');
      const url = phone.length >= 10
        ? `https://wa.me/91${phone.slice(-10)}?text=${encodeURIComponent(lines)}`
        : `https://wa.me/?text=${encodeURIComponent(lines)}`;
      window.open(url, '_blank');
    }

                <div>

                  <div class="text-[11px] font-mono text-slate-400">Code: ${p.code}</div>
                </div>
              </div>
            </td>
            <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 font-medium">${p.category}</span></td>

                ${p.stock} units
              </span>
            </td>
            <td class="px-4 py-3 text-right space-x-1">
              <button onclick="openProductFormModal('${p.id}')" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-brand-600" title="Edit"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
              <button onclick="deleteProduct('${p.id}')" class="p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950 text-rose-600" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>

    function filterProductsTable() {
      const q = document.getElementById('prod-search').value.toLowerCase();
      const status = document.getElementById('prod-stock-filter').value;
      const filtered = getFirm().products.filter(p => {
        const matchQ = p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
        if (status === 'LOW') return matchQ && p.stock <= p.lowStockLimit;
        if (status === 'OUT') return matchQ && p.stock <= 0;
        return matchQ;
      });
      document.getElementById('products-tbody').innerHTML = renderProductRows(filtered);
      lucide.createIcons();
    }

    function handleImageUpload(event, targetInputId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById(targetInputId).value = e.target.result;
        showToast('Image loaded successfully');
      };
      reader.readAsDataURL(file);
    }

    function saveProduct(e, existingId) {
      e.preventDefault();
      const firm = getFirm();
      const data = {
        id: existingId || 'P' + Date.now(),
        code: document.getElementById('pf-code').value.trim(),
        name: document.getElementById('pf-name').value.trim(),
        category: document.getElementById('pf-category').value.trim(),
        gst: Number(document.getElementById('pf-gst').value),
        costPrice: Number(document.getElementById('pf-cost').value),
        sellingPrice: Number(document.getElementById('pf-sell').value),
        stock: Number(document.getElementById('pf-stock').value),
        lowStockLimit: Number(document.getElementById('pf-low').value),
        description: document.getElementById('pf-desc').value.trim(),
        image: document.getElementById('pf-img-url').value.trim()
      };

      if (existingId) {
        const idx = firm.products.findIndex(x => x.id === existingId);
        if (idx !== -1) firm.products[idx] = data;
      } else {
        firm.products.push(data);
      }
      saveState();
      closeModal();
      renderCurrentRoute();
      showToast(existingId ? 'Product updated!' : 'Product added to inventory!');
    }

    function deleteProduct(id) {
      const firm = getFirm();
      firm.products = firm.products.filter(p => p.id !== id);
      saveState();
      renderCurrentRoute();
      showToast('Product deleted', 'info');
    }

    function switchMode(mode) {
      const adminShell = document.getElementById('admin-shell');
      const storeShell = document.getElementById('storefront-shell');
      if (mode === 'store') {
        adminShell.classList.add('hidden');
        storeShell.classList.remove('hidden');
        initStorefront();
      } else {
        storeShell.classList.add('hidden');
        adminShell.classList.remove('hidden');
        renderCurrentRoute();
      }
      lucide.createIcons();
    }

    function initStorefront() {
      const firm = getFirm();
      document.getElementById('sf-store-name').textContent = firm.profile.storeName || firm.profile.businessName;
      document.getElementById('sf-store-desc').textContent = firm.profile.storeDescription || '';
      document.getElementById('sf-footer-info').textContent = `${firm.profile.businessName} • ${firm.profile.address} • Ph: ${firm.profile.phone}`;

      const logoImg = document.getElementById('sf-logo');
      const logoFallback = document.getElementById('sf-logo-fallback');
      if (firm.profile.logo) {
        logoImg.src = firm.profile.logo;
        logoImg.classList.remove('hidden');
        logoFallback.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoFallback.classList.remove('hidden');

      const categories = ['All', ...new Set(firm.products.map(p => p.category))];
      document.getElementById('sf-categories').innerHTML = categories.map(cat => `
        <button onclick="selectStoreCategory('${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ${sfSelectedCategory === cat

          : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">
          ${cat}
        </button>
      `).join('');

      updateStoreCartBadge();
      renderStorefrontProducts();

      sfSelectedCategory = cat;
      initStorefront();
    }

        const matchCat = sfSelectedCategory === 'All' || p.category === sfSelectedCategory;

        return matchCat && matchQ;
      });

      const grid = document.getElementById('sf-product-grid');

        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No products match your search.</div>`;

            <div class="relative h-44 bg-slate-100 dark:bg-slate-800">

            </div>
          </div>
          <div class="px-4 pb-4 pt-2 flex items-center justify-between border-t border-slate-100 dark:border-slate-800">

    function addToStoreCart(productId) {
      const p = getFirm().products.find(x => x.id === productId);
      if (!p || p.stock <= 0) return;
      const existing = storeCart.find(i => i.productId === productId);
      if (existing) {
        if (existing.qty + 1 > p.stock) {
          showToast('Maximum available stock reached', 'error');
          return;
        }
        existing.qty += 1;
      } else {
        storeCart.push({ productId: p.id, name: p.name, price: p.sellingPrice, gst: p.gst, qty: 1 });
      }
      updateStoreCartBadge();
      showToast(`Added ${p.name} to cart`);
    }

    function updateStoreCartBadge() {
      const count = storeCart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('sf-cart-count').textContent = count;
    }

    function toggleStoreCart() {
      const drawer = document.getElementById('sf-cart-drawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) renderStoreCartDrawer();
    }

    function updateStoreCartQty(productId, delta) {
      const idx = storeCart.findIndex(i => i.productId === productId);
      if (idx === -1) return;
      const p = getFirm().products.find(x => x.id === productId);
      const next = storeCart[idx].qty + delta;
      if (next <= 0) storeCart.splice(idx, 1);
      else if (p && next > p.stock) { showToast(`Only ${p.stock} left`, 'error'); return; }
      else storeCart[idx].qty = next;
      updateStoreCartBadge();
      renderStoreCartDrawer();
    }

    function renderStoreCartDrawer() {
      const body = document.getElementById('sf-cart-body');
      const firm = getFirm();
      if (!storeCart.length) {
        body.innerHTML = `<div class="text-center py-16 text-xs text-slate-400">Your cart is empty. Browse products to add items!</div>`;
        return;
      }

      const subtotal = storeCart.reduce((s, i) => s + i.price * i.qty, 0);
      const totalTax = storeCart.reduce((s, i) => s + (i.price * i.qty * i.gst / 100), 0);
      const grandTotal = subtotal + totalTax;

      body.innerHTML = `
        <div class="space-y-2.5">
          ${storeCart.map(item => `
            <div class="flex items-center justify-between gap-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 text-xs">
              <div class="flex-1 min-w-0">
                <div class="font-bold truncate">${item.name}</div>
                <div class="text-[11px] text-slate-500">${fmtINR(item.price)} + ${item.gst}% GST</div>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="updateStoreCartQty('${item.productId}', -1)" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-700 border font-bold">-</button>
                <span class="w-5 text-center font-bold">${item.qty}</span>
                <button onclick="updateStoreCartQty('${item.productId}', 1)" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-700 border font-bold">+</button>
              </div>
              <div class="font-extrabold w-16 text-right">${fmtINR(item.price * item.qty)}</div>
            </div>
          `).join('')}
        </div>

        <div class="p-3.5 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 text-xs space-y-1">
          <div class="flex justify-between"><span>Subtotal:</span><span>${fmtINR(subtotal)}</span></div>
          <div class="flex justify-between"><span>Estimated GST:</span><span>${fmtINR(totalTax)}</span></div>
          <div class="flex justify-between font-extrabold text-sm pt-1 border-t border-emerald-200 dark:border-emerald-800">
            <span>Total Payable:</span><span class="text-emerald-700 dark:text-emerald-400">${fmtINR(grandTotal)}</span>
          </div>
        </div>

        <form onsubmit="submitOnlineOrder(event)" class="space-y-3 border-t border-slate-200 dark:border-slate-800 pt-4 text-xs">
          <h4 class="font-bold text-sm">Delivery & Payment Details</h4>

    function toggleStoreUPIBox(val) {

    function submitOnlineOrder(e) {
      e.preventDefault();
      const firm = getFirm();
      const customerName = document.getElementById('sf-cust-name').value.trim();
      const customerPhone = document.getElementById('sf-cust-phone').value.trim();
      const customerAddress = document.getElementById('sf-cust-addr').value.trim();
      const paymentMethod = document.getElementById('sf-pay-mode').value;
      const utrRef = document.getElementById('sf-utr')?.value.trim() || '';

      let subtotal = 0, totalTax = 0;
      const orderItems = storeCart.map(item => {
        const taxable = item.price * item.qty;
        const taxAmt = taxable * (item.gst / 100);
        subtotal += taxable;
        totalTax += taxAmt;
        // Reserve/deduct stock upon order placement
        const p = firm.products.find(x => x.id === item.productId);
        if (p) p.stock = Math.max(0, p.stock - item.qty);
        return { productId: item.productId, name: item.name, qty: item.qty, price: item.price, gst: item.gst, taxable, taxAmt, total: taxable + taxAmt };
      });

      const orderId = 'ORD-' + firm.orderCounter++;
      const newOrder = {
        id: orderId,
        date: new Date().toISOString().split('T')[0],
        customerName, customerPhone, customerAddress,
        paymentMethod, utrRef,
        paymentStatus: 'Pending',
        status: 'New',
        items: orderItems,
        subtotal, totalTax, grandTotal: subtotal + totalTax
      };

      firm.onlineOrders.unshift(newOrder);

      // Add to Customer CRM
      let cust = firm.customers.find(c => c.phone === customerPhone);
      if (!cust) {
        firm.customers.push({ id: 'CUS-' + Date.now(), name: customerName, phone: customerPhone, email: '', address: customerAddress, totalSpend: newOrder.grandTotal, ordersCount: 1, dueBalance: 0 });
      } else {
        cust.totalSpend += newOrder.grandTotal;
        cust.ordersCount += 1;
      }

      storeCart = [];
      saveState();
      updateStoreCartBadge();
      toggleStoreCart();
      renderStorefrontProducts();
      openModal('Order Placed Successfully!', `
        <div class="text-center space-y-3 py-4">
          <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto">
            <i data-lucide="check" class="w-8 h-8"></i>
          </div>
          <h3 class="text-lg font-extrabold">Thank you, ${customerName}!</h3>
          <p class="text-xs text-slate-500">Your Order ID is <strong class="text-slate-900 dark:text-white font-mono">${orderId}</strong>. Save this ID to track your order status anytime.</p>
          <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Continue Shopping</button>
        </div>
      `, 'max-w-md');
    }

    function filterOrdersList() {
      const q = document.getElementById('ord-search').value.toLowerCase();
      const st = document.getElementById('ord-status-filter').value;
      const filtered = getFirm().onlineOrders.filter(o => {
        const matchQ = o.id.toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.customerPhone.includes(q);
        const matchSt = st === 'ALL' || o.status === st;
        return matchQ && matchSt;
      });
      document.getElementById('orders-list-container').innerHTML = renderOrderCards(filtered);
      lucide.createIcons();
    }

    function updateOrderStatus(orderId, newStatus) {
      const firm = getFirm();
      const order = firm.onlineOrders.find(o => o.id === orderId);
      if (!order) return;

      // Auto-restore stock if cancelled from a non-cancelled state
      if (newStatus === 'Cancelled' && order.status !== 'Cancelled') {
        order.items.forEach(item => {
          const p = firm.products.find(x => x.id === item.productId);
          if (p) p.stock += item.qty;
        });
        showToast(`Order ${orderId} cancelled & product stock restored!`);
      } else {
        showToast(`Order ${orderId} marked as ${newStatus}`);
      }

      order.status = newStatus;
      saveState();
      renderCurrentRoute();
    }

    function confirmOrderPayment(orderId) {
      const order = getFirm().onlineOrders.find(o => o.id === orderId);
      if (!order) return;
      order.paymentStatus = 'Paid';
      saveState();
      renderCurrentRoute();
      showToast(`Payment verified for ${orderId}`);
    }

          <button type="submit" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold">

          </button>
        </form>
      `;

    function submitProductReturn(e, saleId) {
      e.preventDefault();
      const firm = getFirm();
      const sale = firm.sales.find(s => s.id === saleId);
      if (!sale) return;

      const inputs = document.querySelectorAll('.ret-qty-input');
      const returnedItems = [];
      let refundAmount = 0;

      inputs.forEach(inp => {
        const qty = Number(inp.value || 0);
        const idx = Number(inp.dataset.idx);
        if (qty > 0) {
          const orig = sale.items[idx];
          const unitTotal = orig.price * (1 + orig.gst / 100);
          refundAmount += unitTotal * qty;
          returnedItems.push({ productId: orig.productId, name: orig.name, qty, refund: unitTotal * qty });

          // Restore inventory stock
          const prod = firm.products.find(p => p.id === orig.productId);
          if (prod) prod.stock += qty;
        }
      });

      if (!returnedItems.length) {
        showToast('Enter at least 1 item quantity to return.', 'error');
        return;
      }

      firm.returns.push({
        id: 'RET-' + Date.now().toString().slice(-5),
        date: new Date().toISOString().split('T')[0],
        saleId: sale.id,
        invoiceNo: sale.invoiceNo,
        customerName: sale.customerName,
        reason: document.getElementById('ret-reason').value.trim(),
        items: returnedItems,
        refundAmount
      });

      saveState();
      renderCurrentRoute();
      showToast(`Return processed (${fmtINR(refundAmount)}) & stock restored!`);
    }

     *************************************************************************/
    function renderReports(container) {
      const firm = getFirm();
      const salesTotal = firm.sales.reduce((s, b) => s + b.grandTotal, 0);
      const taxableSales = firm.sales.reduce((s, b) => s + (b.subtotal - b.discount), 0);
      const cogs = firm.sales.reduce((s, b) => s + (b.totalCost || 0), 0);
      const expenses = firm.expenses.reduce((s, e) => s + e.amount, 0);
      const returns = firm.returns.reduce((s, r) => s + r.refundAmount, 0);
      const netProfit = taxableSales - cogs - expenses - returns;

      // GST Slab Grouping
      const slabs = { 0: { taxable: 0, cgst: 0, sgst: 0, igst: 0 }, 5: { taxable: 0, cgst: 0, sgst: 0, igst: 0 }, 12: { taxable: 0, cgst: 0, sgst: 0, igst: 0 }, 18: { taxable: 0, cgst: 0, sgst: 0, igst: 0 }, 28: { taxable: 0, cgst: 0, sgst: 0, igst: 0 } };
      firm.sales.forEach(s => {
        s.items.forEach(i => {
          const sl = slabs[i.gst] || slabs[0];
          sl.taxable += i.taxable;
          if (s.taxType === 'LOCAL') {
            sl.cgst += i.taxAmt / 2;
            sl.sgst += i.taxAmt / 2;
          } else {
            sl.igst += i.taxAmt;
          }
        });
      });

      container.innerHTML = `
        <!-- P&L Summary Banner -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-4">

    function deleteCurrentFirm() {
      const firm = getFirm();
      if (!firm) return;
      const firmName = firm.profile.businessName || 'this firm';
      const answer = prompt(`This will permanently delete the firm profile and ALL records belonging to "${firmName}" including products, sales, invoices, orders, purchases, customers, suppliers, expenses, stock and reports.\n\nType DELETE FIRM to confirm:`);
      if (answer !== 'DELETE FIRM') {
        showToast('Firm deletion cancelled. No data was changed.', 'info');
        return;
      }
      const deletingId = appState.activeFirmId;
      delete appState.firms[deletingId];
      const remainingIds = Object.keys(appState.firms);
      if (remainingIds.length) {
        appState.activeFirmId = remainingIds[0];
      } else {
        const newId = 'FIRM_' + Date.now();
        appState.firms[newId] = createEmptyFirmData(newId, 'My Business');
        appState.activeFirmId = newId;
      }
      posCart = [];
      storeCart = [];
      saveState();
      populateFirmSwitcher();
      navigateTo('firm');
      showToast(`Firm "${firmName}" and all its details were deleted.`);
    }

     *************************************************************************/
    function exportToExcel(type) {
      if (typeof XLSX === 'undefined') {
        showToast('Excel library still loading, try again in a second.', 'error');
        return;
      }
      const firm = getFirm();
      let rows = [];
      let filename = `${firm.profile.businessName.replace(/\s+/g, '_')}_${type}.xlsx`;

      if (type === 'products') {
        rows = firm.products.map(p => ({ Code: p.code, Name: p.name, Category: p.category, CostPrice: p.costPrice, SellingPrice: p.sellingPrice, GST_Percent: p.gst, Stock: p.stock, LowStockLimit: p.lowStockLimit }));
      } else if (type === 'sales') {
        rows = firm.sales.map(s => ({ InvoiceNo: s.invoiceNo, Date: s.date, Customer: s.customerName, Phone: s.customerPhone, TaxType: s.taxType, PaymentMethod: s.paymentMethod, Status: s.paymentStatus, Subtotal: s.subtotal, GST: s.totalTax, Discount: s.discount, GrandTotal: s.grandTotal }));
      } else if (type === 'orders') {
        rows = firm.onlineOrders.map(o => ({ OrderID: o.id, Date: o.date, Customer: o.customerName, Phone: o.customerPhone, Address: o.customerAddress, Payment: o.paymentMethod, UTR: o.utrRef, PaymentStatus: o.paymentStatus, OrderStatus: o.status, Total: o.grandTotal }));
      } else if (type === 'purchases') {
        rows = firm.purchases.map(p => ({ PurchaseID: p.id, Date: p.date, Supplier: p.supplierName, PaymentMethod: p.paymentMethod, TotalAmount: p.totalAmount }));
      } else if (type === 'expenses') {
        rows = firm.expenses.map(e => ({ ID: e.id, Date: e.date, Category: e.category, Description: e.description, Amount: e.amount }));
      }

      if (!rows.length) {
        showToast('No records available to export.', 'info');
        return;
      }
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, type.toUpperCase());
      XLSX.writeFile(wb, filename);
      showToast(`Exported ${filename}`);
    }

    function downloadBackup(scope) {
      const payload = scope === 'active'
        ? { version: '3.0', scope: 'single', firm: getFirm() }
        : { version: '3.0', scope: 'all', state: appState };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SMART_DUKAAN_BACKUP_${scope.toUpperCase()}_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON downloaded!');
    }

    function restoreBackupFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.scope === 'all' && parsed.state?.firms) {
            appState = parsed.state;
          } else if (parsed.scope === 'single' && parsed.firm?.profile?.id) {
            appState.firms[parsed.firm.profile.id] = parsed.firm;
            appState.activeFirmId = parsed.firm.profile.id;
          } else {
            throw new Error('Invalid backup structure');
          }
          saveState();
          populateFirmSwitcher();
          renderCurrentRoute();
          showToast('Backup restored successfully!');
        } catch (err) {
          showToast('Invalid or corrupted backup JSON file.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function deleteAllBusinessData() {
      const confirmation = prompt('This permanently deletes ALL SMART DUKAAN business data in this browser. Type DELETE to confirm:');
      if (confirmation !== 'DELETE') {
        showToast('Deletion cancelled. No data was changed.', 'info');
        return;
      }
      // Remove only SMART DUKAAN storage keys; do not clear unrelated websites' local data.
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      const id = 'FIRM_' + Date.now();
      appState = {
        activeFirmId: id,
        theme: appState.theme || 'light',
        cloudConfig: { url: '', anonKey: '', adminEmail: '', lastSync: null, connected: false },
        firms: { [id]: createEmptyFirmData(id, 'My Business') }
      };
      posCart = [];
      storeCart = [];
      saveState();
      populateFirmSwitcher();
      currentRoute = 'firm';
      navigateTo('firm');
      showToast('All business data deleted. Your blank firm profile is ready.');
    }

    function saveCloudConfig(e) {

    async function triggerCloudSync() {
      const cfg = appState.cloudConfig;
      if (!cfg.url || !cfg.anonKey) {
        showToast('Enter Supabase Project URL & Anon Key first.', 'error');
        return;
      }
      try {
        // Attempt REST ping to Supabase endpoint
        const res = await fetch(`${cfg.url}/rest/v1/`, {
          headers: { apikey: cfg.anonKey, Authorization: `Bearer ${cfg.anonKey}` }
        });
        cfg.lastSync = new Date().toLocaleString();
        cfg.connected = res.ok;
        saveState();
        renderCurrentRoute();
        showToast(res.ok ? 'Cloud synchronization verified!' : 'Reachable, verify table RLS policies.', res.ok ? 'success' : 'info');
      } catch (err) {
        showToast('Network error reaching Supabase URL.', 'error');
      }
    }


    /*************************************************************************
     * V3.0 MODULE ENGINE — additional business modules
     *************************************************************************/
    const V3_MODULES = {
      quotations:{title:'Quotations',key:'quotations',fields:[['customer','Customer name','text'],['phone','Phone','tel'],['validUntil','Valid until','date'],['amount','Quotation amount (₹)','number'],['notes','Notes','text']],cols:['customer','phone','validUntil','amount','status'],labels:{customer:'Customer',phone:'Phone',validUntil:'Valid Until',amount:'Amount',status:'Status'}},
      warehouses:{title:'Warehouses',key:'warehouses',fields:[['name','Warehouse name','text'],['location','Address / location','text'],['phone','Contact number','tel']],cols:['name','location','phone'],labels:{name:'Warehouse',location:'Location',phone:'Phone'}},
      cashbook:{title:'Cash Book',key:'cashbook',fields:[['date','Date','date'],['type','Entry type','select','Receipt,Payment'],['category','Category','text'],['description','Description','text'],['amount','Amount (₹)','number']],cols:['date','type','category','description','amount'],labels:{date:'Date',type:'Type',category:'Category',description:'Description',amount:'Amount'}},
      bankbook:{title:'Bank Book',key:'bankbook',fields:[['date','Date','date'],['account','Bank / account','text'],['type','Entry type','select','Deposit,Withdrawal'],['reference','Reference / UTR','text'],['description','Description','text'],['amount','Amount (₹)','number']],cols:['date','account','type','reference','description','amount'],labels:{date:'Date',account:'Account',type:'Type',reference:'Reference',description:'Description',amount:'Amount'}},
      income:{title:'Other Income',key:'income',fields:[['date','Date','date'],['source','Income source','text'],['description','Description','text'],['amount','Amount (₹)','number'],['payment','Payment mode','select','Cash,UPI,Bank Transfer,Card']],cols:['date','source','description','amount','payment'],labels:{date:'Date',source:'Source',description:'Description',amount:'Amount',payment:'Payment'}},
      tasks:{title:'Task Manager',key:'tasks',fields:[['title','Task','text'],['dueDate','Due date','date'],['priority','Priority','select','Low,Medium,High'],['assignedTo','Assigned to','text'],['notes','Notes','text']],cols:['title','dueDate','priority','assignedTo','status'],labels:{title:'Task',dueDate:'Due date',priority:'Priority',assignedTo:'Assigned to',status:'Status'}},
      employees:{title:'Employees',key:'employees',fields:[['name','Employee name','text'],['phone','Phone','tel'],['role','Role','select','Owner,Manager,Cashier,Inventory,Delivery,Other'],['joiningDate','Joining date','date'],['monthlySalary','Monthly salary (₹)','number']],cols:['name','phone','role','joiningDate','monthlySalary'],labels:{name:'Name',phone:'Phone',role:'Role',joiningDate:'Joining',monthlySalary:'Monthly salary'}},
      attendance:{title:'Attendance',key:'attendance',fields:[['employee','Employee name','text'],['date','Date','date'],['status','Attendance','select','Present,Absent,Half Day,Leave'],['notes','Notes','text']],cols:['employee','date','status','notes'],labels:{employee:'Employee',date:'Date',status:'Status',notes:'Notes'}},
      salaries:{title:'Salary Register',key:'salaries',fields:[['employee','Employee name','text'],['month','Salary month (YYYY-MM)','month'],['basic','Basic salary (₹)','number'],['deduction','Deductions (₹)','number'],['paid','Amount paid (₹)','number'],['paymentDate','Payment date','date']],cols:['employee','month','basic','deduction','paid','paymentDate'],labels:{employee:'Employee',month:'Month',basic:'Basic',deduction:'Deductions',paid:'Paid',paymentDate:'Payment date'}},
      offers:{title:'Offers & Coupons',key:'offers',fields:[['code','Coupon code','text'],['description','Offer description','text'],['discountType','Discount type','select','Percentage,Fixed Amount'],['discount','Discount value','number'],['validUntil','Valid until','date'],['minOrder','Minimum order (₹)','number']],cols:['code','description','discountType','discount','validUntil','minOrder'],labels:{code:'Code',description:'Offer',discountType:'Type',discount:'Value',validUntil:'Valid until',minOrder:'Minimum order'}},
      delivery:{title:'Delivery Manager',key:'delivery',fields:[['orderRef','Order / invoice reference','text'],['customer','Customer','text'],['phone','Phone','tel'],['address','Delivery address','text'],['assignedTo','Delivery person','text'],['status','Delivery status','select','Pending,Assigned,Out for Delivery,Delivered,Failed'],['deliveryDate','Delivery date','date']],cols:['orderRef','customer','phone','assignedTo','status','deliveryDate'],labels:{orderRef:'Order ref',customer:'Customer',phone:'Phone',assignedTo:'Assigned to',status:'Status',deliveryDate:'Date'}},
      branches:{title:'Branches',key:'branches',fields:[['name','Branch name','text'],['address','Address','text'],['phone','Phone','tel']],cols:['name','address','phone'],labels:{name:'Branch',address:'Address',phone:'Phone'}},
      transfers:{title:'Stock Transfers',key:'stockTransfers',fields:[['productId','Product ID','text'],['from','From warehouse','text'],['to','To warehouse','text'],['qty','Quantity','number'],['date','Transfer date','date'],['notes','Notes','text']],cols:['productId','from','to','qty','date','notes'],labels:{productId:'Product ID',from:'From',to:'To',qty:'Quantity',date:'Date',notes:'Notes'}},
      quotations:{title:'Quotations',key:'quotations',fields:[['customer','Customer name','text'],['phone','Phone','tel'],['validUntil','Valid until','date'],['amount','Quotation amount (₹)','number'],['notes','Notes','text']],cols:['customer','phone','validUntil','amount','status'],labels:{customer:'Customer',phone:'Phone',validUntil:'Valid Until',amount:'Amount',status:'Status'}},
      audit:{title:'Activity Log',key:'auditLog',fields:[],cols:['date','action','details'],labels:{date:'Date',action:'Activity',details:'Details'}}
    };
    const V3_TODAY = () => new Date().toISOString().slice(0,10);
    const v3Esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const v3Money = v => fmtINR(Number(v)||0);
    function v3FieldHtml(f){
      const [id,label,type,opts]=f; const value=type==='date'?V3_TODAY():'';
      if(type==='select') return `<div><label class="block text-xs font-semibold mb-1">${label}</label><select id="v3-${id}" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm">${opts.split(',').map(x=>`<option>${x}</option>`).join('')}</select></div>`;
      return `<div><label class="block text-xs font-semibold mb-1">${label}</label><input id="v3-${id}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} value="${value}" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm"></div>`;
    }
    function renderV3Module(container,key){
      const f=getFirm(); const cfg=V3_MODULES[key];
      if(key==='barcode'){ renderBarcodeStudio(container); return; }
      const rows=f[cfg.key]||[];
      const total=rows.length;
      const sum=['cashbook','bankbook','income','salaries','quotations'].includes(key)?rows.reduce((s,r)=>s+Number(r.amount||r.paid||0),0):null;
      container.innerHTML=`<div class="space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-extrabold">${cfg.title}</h2><p class="text-xs text-slate-500 mt-1">Records are saved in this browser for the active firm.</p></div><div class="flex gap-2"><button onclick="exportV3Module('${key}')" class="px-3 py-2 rounded-xl border text-xs font-semibold">Export CSV</button>${key==='audit'?'':`<button onclick="openV3Form('${key}')" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">+ Add New</button>`}</div></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500">Total records</p><p class="text-2xl font-extrabold mt-1">${total}</p></div>${sum!==null?`<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4"><p class="text-xs text-slate-500">Total recorded amount</p><p class="text-2xl font-extrabold mt-1">${v3Money(sum)}</p></div>`:''}</div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"><div class="p-3 border-b border-slate-100 dark:border-slate-800"><input id="v3-search" oninput="filterV3Table('${key}')" placeholder="Search records..." class="w-full sm:max-w-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm"></div><div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-slate-50 dark:bg-slate-800"><tr>${cfg.cols.map(c=>`<th class="px-4 py-3 font-bold">${cfg.labels[c]||c}</th>`).join('')}<th class="px-4 py-3">Action</th></tr></thead><tbody id="v3-table-body">${rows.length?rows.map(r=>v3RowHtml(key,r)).join(''):`<tr><td colspan="${cfg.cols.length+1}" class="px-4 py-10 text-center text-slate-400">No records yet. Select Add New to begin.</td></tr>`}</tbody></table></div></div>
        ${key==='transfers'?'<p class="text-xs text-amber-700 bg-amber-50 p-3 rounded-xl">Stock transfer entries are recorded here. This simple V3 module does not maintain separate per-warehouse stock balances yet.</p>':''}
      </div>`;
    }
    function v3RowHtml(key,r){
      const cfg=V3_MODULES[key]; const cells=cfg.cols.map(c=>`<td class="px-4 py-3 whitespace-nowrap">${v3Esc(c==='amount'||c==='paid'||c==='basic'||c==='monthlySalary'?v3Money(r[c]):r[c]??'—')}</td>`).join('');
      const action=key==='audit'?'':`<button onclick="deleteV3Record('${key}','${v3Esc(r.id)}')" class="text-rose-600 font-semibold">Delete</button>`;
      return `<tr class="border-t border-slate-100 dark:border-slate-800">${cells}<td class="px-4 py-3">${action}</td></tr>`;
    }
    function openV3Form(key){
      const cfg=V3_MODULES[key];
      openModal('Add '+cfg.title,`<form onsubmit="saveV3Record(event,'${key}')" class="space-y-4"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${cfg.fields.map(v3FieldHtml).join('')}</div><div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button><button class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Save Record</button></div></form>`);
    }
    function saveV3Record(e,key){
      e.preventDefault(); const f=getFirm(),cfg=V3_MODULES[key],obj={id:'V3-'+Date.now()};
      cfg.fields.forEach(([id,label,type])=>{const el=document.getElementById('v3-'+id);obj[id]=type==='number'?Number(el.value||0):el.value.trim();});
      if(!obj[cfg.fields[0]?.[0]]) return showToast('Please complete the main required field.','error');
      if(['cashbook','bankbook','income','salaries','quotations'].includes(key)){const amount=Number(obj.amount??obj.paid??0);if(amount<0)return showToast('Amount cannot be negative.','error');}
      if(key==='transfers'){
        const p=f.products.find(x=>x.id===obj.productId||x.code===obj.productId||x.name.toLowerCase()===obj.productId.toLowerCase());
        if(!p)return showToast('Product ID / code / name not found.','error');
        if(!obj.from||!obj.to||obj.from===obj.to||obj.qty<=0)return showToast('Enter valid source, destination and quantity.','error');
        if(Number(p.stock??p.qty??0)<obj.qty)return showToast('Not enough available stock for this transfer.','error');
        // Track the transfer without changing overall stock; locations are a directory only in this version.
        obj.productName=p.name;
      }
      if(key==='quotations')obj.status='Draft';
      if(key==='tasks')obj.status='Pending';
      f[cfg.key].unshift(obj); addAudit('Created '+cfg.title,JSON.stringify(obj)); saveState(); closeModal(); renderCurrentRoute(); showToast(cfg.title+' record saved.');
    }
    function deleteV3Record(key,id){
      if(!confirm('Delete this record?'))return; const f=getFirm(),cfg=V3_MODULES[key];
      f[cfg.key]=f[cfg.key].filter(x=>String(x.id)!==String(id)); addAudit('Deleted '+cfg.title,id); saveState(); renderCurrentRoute(); showToast('Record deleted.');
    }
    function filterV3Table(key){const q=(document.getElementById('v3-search')?.value||'').toLowerCase();document.querySelectorAll('#v3-table-body tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none');}
    function exportV3Module(key){
      const f=getFirm(),cfg=V3_MODULES[key],rows=f[cfg.key]||[];
      if(!rows.length)return showToast('No records to export.','info');
      const csv=[Object.keys(rows[0]).join(','),...rows.map(r=>Object.values(r).map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${key}_${V3_TODAY()}.csv`;a.click();URL.revokeObjectURL(url);showToast('CSV export downloaded.');
    }
    function renderBarcodeStudio(container){
      const f=getFirm(); container.innerHTML=`<div class="space-y-4"><div><h2 class="text-xl font-extrabold">Barcode Studio</h2><p class="text-xs text-slate-500 mt-1">Find a product and print a simple label containing its code and name.</p></div><div class="bg-white dark:bg-slate-900 border rounded-2xl p-4"><input id="barcode-q" oninput="renderBarcodeResults()" placeholder="Search product name or barcode..." class="w-full sm:max-w-md px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-sm"><div id="barcode-results" class="mt-4"></div></div></div>`; renderBarcodeResults();
    }
    function renderBarcodeResults(){const f=getFirm(),q=(document.getElementById('barcode-q')?.value||'').toLowerCase(),el=document.getElementById('barcode-results');if(!el)return;const ps=f.products.filter(p=>(p.name+' '+(p.code||'')).toLowerCase().includes(q));el.innerHTML=ps.map(p=>`<div class="flex flex-wrap items-center justify-between gap-2 py-3 border-t"><div><b>${v3Esc(p.name)}</b><p class="text-xs text-slate-500">Code: ${v3Esc(p.code||p.id)} · Price: ${fmtINR(p.price||0)}</p><div class="font-mono tracking-[.25em] text-lg mt-1">${v3Esc(p.code||p.id)}</div></div><button onclick="printBarcodeLabel('${v3Esc(p.id)}')" class="px-3 py-2 rounded-xl bg-brand-600 text-white text-xs">Print Label</button></div>`).join('')||'<p class="text-sm text-slate-400 py-5">No products found.</p>';}
    function printBarcodeLabel(id){const f=getFirm(),p=f.products.find(x=>x.id===id);if(!p)return;const w=window.open('','_blank');if(!w)return showToast('Allow pop-ups to print labels.','error');w.document.write(`<html><head><title>Product Label</title><style>body{font:14px Arial;padding:20px}.label{width:55mm;border:1px dashed #777;padding:8mm;text-align:center;margin:8px auto}.code{font:20px monospace;letter-spacing:3px;margin:10px 0}</style></head><body><div class="label"><b>${v3Esc(p.name)}</b><div class="code">${v3Esc(p.code||p.id)}</div><b>${fmtINR(p.price||0)}</b></div><script>window.print()<\/script></body></html>`);w.document.close();}
    // Browser storage safety and audit helpers
    function v3StorageStatus(){try{const used=new Blob(Object.values(localStorage)).size;return `${(used/1024/1024).toFixed(2)} MB local storage used (approx.)`;}catch(e){return 'Storage usage unavailable';}}
    window.addEventListener('error',e=>{try{addAudit('Application error',e.message);saveState();}catch(_){}});

    /*************************************************************************
     * 16. INITIALIZATION
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      navigateTo('dashboard');
    });
  </script>
<script>
  // PWA app-shell caching. The service worker file must be uploaded beside index.html.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA worker registration failed:', err)));
  }
</script>
