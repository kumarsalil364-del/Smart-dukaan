<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART DUKAAN PRO</title>

<style>
:root {
  --bg:#0b1224;
  --panel:#15213b;
  --line:#293b5d;
  --blue:#5685ff;
  --cyan:#41d6df;
  --text:#f1f5ff;
  --muted:#a6b4d0;
  --green:#35c995;
  --red:#ff7181;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.layout {
  display:grid;
  grid-template-columns:250px 1fr;
  min-height:100vh;
}
.sidebar {
  background:#101a32;
  border-right:1px solid var(--line);
  padding:20px 14px;
}
.brand-box {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  margin-bottom:20px;
  border-bottom:1px solid var(--line);
  padding-bottom:15px;
}
.brand-logo {
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--cyan);
}
.brand-title {
  font-size:18px;
  font-weight:bold;
  color:var(--cyan);
  line-height:1.2;
}
.brand-title small {
  display:block;
  font-size:9px;
  color:var(--muted);
  letter-spacing:1px;
  margin-top:3px;
}
nav button {
  width:100%;
  padding:12px;
  margin:3px 0;
  border:0;
  border-radius:9px;
  text-align:left;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:14px;
}
nav button:hover,nav button.active {
  background:#294675;
}
main { padding:25px; min-width:0; }
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}
h1 { margin:0; font-size:26px; }
h2 { font-size:18px; margin-top:0; }
.muted { color:var(--muted); }
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}
.firm-header-preview {
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}
.firm-logo-img {
  width:60px;
  height:60px;
  border-radius:8px;
  object-fit:cover;
  border:1px solid var(--line);
  background:#0c1730;
}
.stats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}
.stat strong {
  display:block;
  font-size:24px;
  margin:8px 0;
}
.stat small { color:var(--muted); }
button,.btn {
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#203657;
  color:white;
  cursor:pointer;
}
.primary {
  background:var(--blue);
  border-color:var(--blue);
}
.danger {
  background:#702b3a;
}
input,select,textarea {
  width:100%;
  padding:10px;
  background:#0c1730;
  border:1px solid var(--line);
  color:white;
  border-radius:8px;
}
label {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:10px 0 4px;
}
.form {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.full { grid-column:1/-1; }
.table-wrap { overflow-x:auto; }
table {
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}
th,td {
  padding:12px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
th { color:var(--muted); }
.actions { display:flex; gap:5px; }
.total {
  font-size:25px;
  color:var(--cyan);
  font-weight:bold;
}
#toast {
  display:none;
  position:fixed;
  bottom:20px;
  right:20px;
  background:#24446d;
  padding:14px 20px;
  border-radius:10px;
  z-index:99;
}
@media(max-width:850px) {
  .stats { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:650px) {
  .layout { display:block; }
  .sidebar { padding:10px; }
  nav { display:flex; overflow-x:auto; }
  nav button { min-width:max-content; }
  main { padding:13px; }
  header { align-items:flex-start; flex-direction:column; }
  .form { grid-template-columns:1fr; }
  .full { grid-column:auto; }
}
</style>
</head>

<body>
<div class="layout">

<aside class="sidebar">
  <div class="brand-box">
    <img src="SMART DUKAAN LOGO 12.jpeg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-title">
      SMART DUKAAN
      <small>BUSINESS SUITE PRO</small>
    </div>
  </div>

  <nav>
    <button class="active" onclick="showPage('dashboard',this)">▦ Dashboard</button>
    <button onclick="showPage('firms',this)">▣ Firm Management</button>
    <button onclick="showPage('products',this)">▤ Products & Stock</button>
    <button onclick="showPage('customers',this)">♙ Customers</button>
    <button onclick="showPage('suppliers',this)">♧ Suppliers</button>
    <button onclick="showPage('sales',this)">＋ Sales & Billing</button>
    <button onclick="showPage('purchases',this)">⇩ Purchases</button>
    <button onclick="showPage('expenses',this)">₹ Expenses</button>
    <button onclick="showPage('reports',this)">▥ Reports</button>
    <button onclick="showPage('backup',this)">⚙ Backup & Restore</button>
  </nav>
</aside>

<main>
<header>
  <div>
    <p class="muted">YOUR SMART BUSINESS MANAGER</p>
    <h1 id="pageTitle">Dashboard</h1>
  </div>
  <select id="firmSelect" onchange="switchFirm()"></select>
</header>

<div id="app"></div>
</main>
</div>

<div id="toast"></div>

<script>
"use strict";

const STORAGE_KEY = "SMART_DUKAAN_PRO_DATA";
const APP_LOGO = "SMART DUKAAN LOGO 12.jpeg";

let database = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  firms: [],
  activeFirm: null,
  records: {}
};

let currentPage = "dashboard";

function saveDatabase() {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(database));
}

function uid() {
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function money(value) {
  return "₹"+Number(value || 0).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function today() {
  return new Date().toISOString().slice(0,10);
}

function notify(message) {
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",2500);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function activeFirm() {
  return database.firms.find(f=>f.id===database.activeFirm);
}

function records(type) {
  if(!database.activeFirm) return [];
  const key=database.activeFirm;
  if(!database.records[key]) database.records[key]={};
  if(!database.records[key][type]) database.records[key][type]=[];
  return database.records[key][type];
}

function addRecord(type,record) {
  record.id=uid();
  records(type).push(record);
  saveDatabase();
}

function deleteRecord(type,id) {
  const data=records(type);
  const index=data.findIndex(x=>x.id===id);
  if(index>=0) data.splice(index,1);
  saveDatabase();
  render();
  notify("Record deleted");
}

function updateFirmSelect() {
  const select=document.getElementById("firmSelect");
  select.innerHTML=database.firms.map(f=>
    `<option value="${f.id}" ${f.id===database.activeFirm?"selected":""}>
      ${escapeHTML(f.name)}
    </option>`
  ).join("");
}

function saveFirmForm(e) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  
  const processFirm = (logoData) => {
    if (data.firmId) {
      const firm = database.firms.find(f=>f.id===data.firmId);
      if(firm) {
        firm.name = data.name.trim();
        firm.owner = data.owner;
        firm.phone = data.phone;
        firm.email = data.email;
        firm.address = data.address;
        firm.gstin = data.gstin;
        firm.bank = data.bank;
        firm.accountNo = data.accountNo;
        firm.ifsc = data.ifsc;
        if(logoData) firm.logo = logoData;
      }
      notify("Firm updated successfully");
    } else {
      const firm = {
        id: uid(),
        name: data.name.trim(),
        owner: data.owner || "",
        phone: data.phone || "",
        email: data.email || "",
        address: data.address || "",
        gstin: data.gstin || "",
        bank: data.bank || "",
        accountNo: data.accountNo || "",
        ifsc: data.ifsc || "",
        logo: logoData || ""
      };
      database.firms.push(firm);
      database.activeFirm = firm.id;
      database.records[firm.id] = {};
      notify("New firm created");
    }
    saveDatabase();
    updateFirmSelect();
    render();
  };

  const fileInput = e.target.logoFile;
  if (fileInput && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = () => processFirm(reader.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    processFirm(null);
  }
}

function editFirmModal(id) {
  const firm = database.firms.find(f=>f.id===id) || {};
  showFirmForm(firm);
}

function showFirmForm(firm = null) {
  const isEdit = !!firm;
  document.getElementById("app").innerHTML = `
  <div class="card">
    <h2>${isEdit ? "Edit Firm Details" : "Create New Firm"}</h2>
    <form class="form" onsubmit="saveFirmForm(event)">
      <input type="hidden" name="firmId" value="${firm?.id || ''}">
      
      <div>
        <label>Firm / Shop Name *</label>
        <input name="name" value="${escapeHTML(firm?.name || '')}" required>
      </div>

      <div>
        <label>Owner Name</label>
        <input name="owner" value="${escapeHTML(firm?.owner || '')}">
      </div>

      <div>
        <label>Phone Number</label>
        <input name="phone" value="${escapeHTML(firm?.phone || '')}">
      </div>

      <div>
        <label>Email Address</label>
        <input name="email" type="email" value="${escapeHTML(firm?.email || '')}">
      </div>

      <div>
        <label>GSTIN (Optional)</label>
        <input name="gstin" value="${escapeHTML(firm?.gstin || '')}">
      </div>

      <div>
        <label>Firm Logo Image</label>
        <input name="logoFile" type="file" accept="image/*">
      </div>

      <div class="full">
        <label>Business Address</label>
        <textarea name="address" rows="2">${escapeHTML(firm?.address || '')}</textarea>
      </div>

      <div>
        <label>Bank Name</label>
        <input name="bank" value="${escapeHTML(firm?.bank || '')}">
      </div>

      <div>
        <label>Account Number</label>
        <input name="accountNo" value="${escapeHTML(firm?.accountNo || '')}">
      </div>

      <div>
        <label>IFSC Code</label>
        <input name="ifsc" value="${escapeHTML(firm?.ifsc || '')}">
      </div>

      <div class="full" style="display:flex; gap:10px;">
        <button type="submit" class="primary">Save Firm Details</button>
        <button type="button" onclick="render()">Cancel</button>
      </div>
    </form>
  </div>`;
}

function switchFirm() {
  database.activeFirm=document.getElementById("firmSelect").value;
  saveDatabase();
  render();
}

function deleteFirm(id) {
  if(database.firms.length<=1) {
    alert("At least one firm must remain.");
    return;
  }
  if(!confirm("Delete this firm and all its records?")) return;

  database.firms=database.firms.filter(f=>f.id!==id);
  delete database.records[id];

  if(database.activeFirm===id) {
    database.activeFirm=database.firms[0].id;
  }

  saveDatabase();
  updateFirmSelect();
  render();
}

function showPage(page,button) {
  currentPage=page;
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  if(button) button.classList.add("active");
  render();
}

function makeTable(headers,rows) {
  return `
  <div class="table-wrap">
  <table>
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>
      ${rows.length?rows.join(""):
        `<tr><td colspan="${headers.length}">No records found</td></tr>`}
    </tbody>
  </table>
  </div>`;
}

function dashboard() {
  const sales=records("sales");
  const products=records("products");
  const expenses=records("expenses");
  const firm = activeFirm() || {};
  const month=today().slice(0,7);

  const monthlySales=sales.filter(s=>(s.date||"").startsWith(month));
  const todaySales=sales.filter(s=>s.date===today());
  const monthlyExpenses=expenses.filter(e=>(e.date||"").startsWith(month));

  const totalToday=todaySales.reduce((a,b)=>a+Number(b.total),0);
  const totalMonth=monthlySales.reduce((a,b)=>a+Number(b.total),0);
  const totalExpenses=monthlyExpenses.reduce((a,b)=>a+Number(b.amount),0);

  return `
  <div class="card">
    <div class="firm-header-preview">
      ${firm.logo ? `<img src="${firm.logo}" class="firm-logo-img">` : ''}
      <div>
        <h2 style="margin:0">${escapeHTML(firm.name || '')}</h2>
        <small class="muted">${escapeHTML(firm.address || 'No address added')} | Phone: ${escapeHTML(firm.phone || 'N/A')}</small>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="card stat">
      <small>Today's Sales</small>
      <strong>${money(totalToday)}</strong>
      <small>${todaySales.length} invoices</small>
    </div>
    <div class="card stat">
      <small>Monthly Sales</small>
      <strong>${money(totalMonth)}</strong>
      <small>${monthlySales.length} invoices</small>
    </div>
    <div class="card stat">
      <small>Monthly Expenses</small>
      <strong>${money(totalExpenses)}</strong>
      <small>Current month</small>
    </div>
    <div class="card stat">
      <small>Total Products</small>
      <strong>${products.length}</strong>
      <small>Inventory items</small>
    </div>
  </div>

  <div class="card">
    <h2>Business Overview</h2>
    <p class="muted">Active firm: ${escapeHTML(firm.name||"")}</p>
    <p>Sales minus recorded expenses:</p>
    <div class="total">${money(totalMonth-totalExpenses)}</div>
  </div>

  <div class="card">
    <h2>Low Stock Alerts</h2>
    ${makeTable(["Product","Stock","Minimum Stock"],
      products.filter(p=>Number(p.stock)<=Number(p.minStock||0))
      .map(p=>`<tr>
        <td>${escapeHTML(p.name)}</td>
        <td>${p.stock}</td>
        <td>${p.minStock||0}</td>
      </tr>`))}
  </div>`;
}

function productForm() {
  const name=prompt("Product name:");
  if(!name) return;

  const code=prompt("Product code:") || "";
  const category=prompt("Category:") || "General";
  const cost=Number(prompt("Purchase cost ₹:")||0);
  const price=Number(prompt("Selling price ₹:")||0);
  const stock=Number(prompt("Opening stock:")||0);
  const minStock=Number(prompt("Minimum stock alert:")||0);
  const gst=Number(prompt("GST rate (0,5,12,18,28):")||0);

  addRecord("products",{name,code,category,cost,price,stock,minStock,gst});
  render();
  notify("Product added");
}

function editProduct(id) {
  const p=records("products").find(x=>x.id===id);
  if(!p) return;

  p.name=prompt("Product name:",p.name)||p.name;
  p.code=prompt("Product code:",p.code)||p.code;
  p.cost=Number(prompt("Cost:",p.cost)||p.cost);
  p.price=Number(prompt("Selling price:",p.price)||p.price);
  p.stock=Number(prompt("Stock:",p.stock)||p.stock);
  p.gst=Number(prompt("GST:",p.gst)||p.gst);

  saveDatabase();
  render();
}

function productsPage() {
  const data=records("products");
  return `
  <div class="card">
    <h2>Products & Stock</h2>
    <button class="primary" onclick="productForm()">+ Add Product</button>
    <button onclick="exportCSV('products')">Export CSV</button>
    <br><br>
    ${makeTable(
      ["Code","Product","Category","Cost","Selling Price","GST","Stock","Actions"],
      data.map(p=>`<tr>
        <td>${escapeHTML(p.code)}</td>
        <td>${escapeHTML(p.name)}</td>
        <td>${escapeHTML(p.category)}</td>
        <td>${money(p.cost)}</td>
        <td>${money(p.price)}</td>
        <td>${p.gst}%</td>
        <td>${p.stock}</td>
        <td class="actions">
          <button onclick="editProduct('${p.id}')">Edit</button>
          <button class="danger" onclick="deleteRecord('products','${p.id}')">Delete</button>
        </td>
      </tr>`)
    )}
  </div>`;
}

function partyForm(type) {
  const name=prompt("Name:");
  if(!name) return;

  const phone=prompt("Phone number:")||"";
  const gstin=prompt("GSTIN (optional):")||"";
  const address=prompt("Address:")||"";

  addRecord(type,{name,phone,gstin,address});
  render();
  notify("Contact saved");
}

function partyPage(type) {
  const data=records(type);
  return `
  <div class="card">
    <h2>${type==="customers"?"Customers":"Suppliers"}</h2>
    <button class="primary" onclick="partyForm('${type}')">+ Add New</button>
    <br><br>
    ${makeTable(["Name","Phone","GSTIN","Address","Action"],
      data.map(x=>`<tr>
        <td>${escapeHTML(x.name)}</td>
        <td>${escapeHTML(x.phone)}</td>
        <td>${escapeHTML(x.gstin)}</td>
        <td>${escapeHTML(x.address)}</td>
        <td><button class="danger" onclick="deleteRecord('${type}','${x.id}')">Delete</button></td>
      </tr>`))}
  </div>`;
}

function salesPage() {
  const products=records("products");
  return `
  <div class="card">
    <h2>Create New Invoice</h2>
    <form id="saleForm" class="form" onsubmit="handleSaleSubmit(event)">
      <div>
        <label>Invoice Date</label>
        <input name="date" type="date" value="${today()}" required>
      </div>
      <div>
        <label>Customer Name</label>
        <input name="customer" placeholder="Customer name">
      </div>
      <div>
        <label>Phone Number</label>
        <input name="phone" placeholder="Phone number">
      </div>
      <div>
        <label>Payment Mode</label>
        <select name="payment">
          <option>Cash</option>
          <option>Google Pay</option>
          <option>PhonePe</option>
          <option>Paytm</option>
          <option>Card</option>
          <option>Bank Transfer</option>
          <option>Credit / Udhaar</option>
        </select>
      </div>
      <div>
        <label>GST Type</label>
        <select name="gstType">
          <option>Local - CGST + SGST</option>
          <option>Interstate - IGST</option>
        </select>
      </div>
      <div>
        <label>Product</label>
        <select name="productId" required>
          ${products.map(p=>`
            <option value="${p.id}">
              ${escapeHTML(p.name)} - ${money(p.price)} (Stock ${p.stock})
            </option>`).join("")}
        </select>
      </div>
      <div>
        <label>Quantity</label>
        <input name="qty" type="number" min="0.01" step="0.01" value="1" required>
      </div>
      <div>
        <label>Discount ₹</label>
        <input name="discount" type="number" min="0" value="0">
      </div>
      <div>
        <label>Price Entry</label>
        <select name="priceMode">
          <option value="exclusive">Price Exclusive of GST</option>
          <option value="inclusive">Price Inclusive of GST</option>
        </select>
      </div>
      <div class="full">
        <button type="submit" class="primary">Generate & Save Bill</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Sales History</h2>
    ${makeTable(["Invoice","Date","Customer","Payment","Total","Action"],
      records("sales").map(s=>`<tr>
        <td>${escapeHTML(s.invoice)}</td>
        <td>${s.date}</td>
        <td>${escapeHTML(s.customer)}</td>
        <td>${escapeHTML(s.payment)}</td>
        <td>${money(s.total)}</td>
        <td><button onclick="printBill('${s.id}')">Print</button></td>
      </tr>`))}
  </div>`;
}

function handleSaleSubmit(e) {
  e.preventDefault();
  try {
    const data=Object.fromEntries(new FormData(e.target).entries());
    const product=records("products").find(p=>p.id===data.productId);
    if(!product) throw new Error("Please add a product first");

    const qty=Number(data.qty);
    if(qty<=0 || qty>Number(product.stock)) {
      throw new Error("Insufficient stock");
    }

    const rate=Number(product.price);
    const gst=Number(product.gst||0);
    const discount=Math.max(0,Number(data.discount||0));

    let taxable, tax, gross;
    if(data.priceMode==="inclusive") {
      gross=rate*qty;
      taxable=gross/(1+gst/100);
      tax=gross-taxable;
    } else {
      taxable=rate*qty;
      tax=taxable*gst/100;
      gross=taxable+tax;
    }

    const finalTaxable=Math.max(0,taxable-discount);
    const finalTax=taxable>0?tax*(finalTaxable/taxable):0;
    const total=finalTaxable+finalTax;
    const interstate=data.gstType.startsWith("Interstate");
    const invoice="SD-"+Date.now().toString().slice(-8);

    const sale={
      invoice,
      date:data.date,
      customer:data.customer||"Walk-in Customer",
      phone:data.phone,
      payment:data.payment,
      gstType:data.gstType,
      items:[{name:product.name,qty,price:rate,gst}],
      subtotal:taxable,
      discount,
      taxable:finalTaxable,
      tax:finalTax,
      cgst:interstate?0:finalTax/2,
      sgst:interstate?0:finalTax/2,
      igst:interstate?finalTax:0,
      total,
      firmName:activeFirm()?.name||"SMART DUKAAN"
    };

    addRecord("sales",sale);
    product.stock=Number(product.stock)-qty;
    saveDatabase();
    notify("Invoice saved successfully");
    render();
  } catch(error) {
    alert(error.message);
  }
}

function purchasesPage() {
  return `
  <div class="card">
    <h2>Record Purchase</h2>
    <form id="purchaseForm" class="form" onsubmit="handlePurchaseSubmit(event)">
      <div>
        <label>Date</label>
        <input name="date" type="date" value="${today()}">

      </div>
      <div>
        <label>Product</label>

      records("purchases").map(p=>`<tr>
        <td>${p.date}</td>

        <td>${escapeHTML(p.productName)}</td>

function handlePurchaseSubmit(e) {
  e.preventDefault();
  try {
    const d=Object.fromEntries(new FormData(e.target).entries());
    const product=records("products").find(p=>p.id===d.productId);
    if(!product) throw new Error("Select a product");

    const qty=Number(d.qty);
    const rate=Number(d.rate);
    if(qty<=0) throw new Error("Enter a valid quantity");

    addRecord("purchases",{
      date:d.date,
      supplier:d.supplier,
      productName:product.name,
      productId:product.id,
      qty,
      rate,
      total:qty*rate
    });

    product.stock=Number(product.stock)+qty;
    product.cost=rate;
    saveDatabase();
    notify("Purchase saved and stock updated");
    render();
  } catch(error) {
    alert(error.message);
  }
}

function reportsPage() {
  const sales=records("sales");
  const expenses=records("expenses");
  const month=today().slice(0,7);

  const monthlySales=sales.filter(s=>(s.date||"").startsWith(month));
  const monthlyExpenses=expenses.filter(e=>(e.date||"").startsWith(month));

  const saleTotal=monthlySales.reduce((a,b)=>a+Number(b.total),0);
  const taxTotal=monthlySales.reduce((a,b)=>a+Number(b.tax),0);
  const expenseTotal=monthlyExpenses.reduce((a,b)=>a+Number(b.amount),0);

  return `
  <div class="stats">
    <div class="card stat"><small>Monthly Sales</small><strong>${money(saleTotal)}</strong></div>
    <div class="card stat"><small>GST Recorded</small><strong>${money(taxTotal)}</strong></div>
    <div class="card stat"><small>Expenses</small><strong>${money(expenseTotal)}</strong></div>
    <div class="card stat"><small>Sales - Expenses</small><strong>${money(saleTotal-expenseTotal)}</strong></div>
  </div>

  <div class="card">
    <h2>Monthly Sales Register</h2>
    ${makeTable(["Invoice","Date","Customer","Total"],
      monthlySales.map(s=>`<tr>
        <td>${escapeHTML(s.invoice)}</td>
        <td>${s.date}</td>
        <td>${escapeHTML(s.customer)}</td>
        <td>${money(s.total)}</td>
      </tr>`))}
    <button onclick="exportCSV('sales')">Export Sales CSV</button>
  </div>

  <p class="muted">
    These are operational summaries, not statutory GST returns or audited accounts.
    Verify tax treatment before using figures for filing.
  </p>`;
}

function backupPage() {
  return `
  <div class="card">
    <h2>Backup & Restore</h2>
    <p class="muted">Save a copy of all firms and their records.</p>
    <button class="primary" onclick="backupData()">Download Full Backup</button>
    <br><br>
    <label>Restore Backup JSON</label>
    <input type="file" id="restoreFile" accept=".json">
    <br><br>
    <button onclick="restoreData()">Restore Data</button>
    <hr>
    <button class="danger" onclick="clearCurrentFirm()">Delete Current Firm Records</button>
  </div>`;
}

function backupData() {
  const blob=new Blob([JSON.stringify(database,null,2)],{type:"application/json"});
  downloadBlob(blob,"smart-dukaan-backup.json");
}

function restoreData() {
  const file=document.getElementById("restoreFile").files[0];
  if(!file) {
    alert("Choose a backup file first.");
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const restored=JSON.parse(reader.result);
      if(!Array.isArray(restored.firms) || !restored.records) {
        throw new Error("Invalid backup format");
      }
      if(!confirm("Restore will replace the current browser data. Continue?")) return;

      database=restored;
      saveDatabase();
      updateFirmSelect();
      render();
      notify("Backup restored");
    } catch(e) {
      alert("Could not restore: "+e.message);
    }
  };
  reader.readAsText(file);
}

function clearCurrentFirm() {
  if(!confirm("Delete all records of this firm?")) return;
  database.records[database.activeFirm]={};
  saveDatabase();
  render();
  notify("Firm records cleared");
}

function downloadBlob(blob,filename) {
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportCSV(type) {
  const data=records(type);
  if(!data.length) {
    alert("No records to export.");
    return;
  }

  const headers=[...new Set(data.flatMap(x=>Object.keys(x)))];
  const quote=value=>'"'+String(typeof value==="object"?JSON.stringify(value):value??"").replace(/"/g,'""')+'"';

  const csv=[
    headers.map(quote).join(","),
    ...data.map(row=>headers.map(h=>quote(row[h])).join(","))
  ].join("\n");

  downloadBlob(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}),type+"-export.csv");
}

  };

  const titles={

    firms:"Firm Management",
    products:"Products & Stock",

    suppliers:"Suppliers",

    purchases:"Purchases",

  document.getElementById("pageTitle").textContent=titles[currentPage];

}
